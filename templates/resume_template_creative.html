<!DOCTYPE html>
<html>
<head>
    <title>Resume</title>
    <style>
        body { font-family: 'Georgia', serif; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        h2, h3 { font-style: italic; }
    </style>
</head>
<body>
    <h1>{{ data.name }}</h1>
    <p>{{ data.email }} | {{ data.phone }}</p>

    <h3>Professional Summary</h3>
    <p>{{ data.summary }}</p>

    <h3>Skills</h3>
    <p>{{ data.skills }}</p>

    <h3>Education</h3>
    <p>{{ data.education }}</p>

    <h3>Work Experience</h3>
    <div>{{ data.experience | safe }}</div>
</body>
</html>
